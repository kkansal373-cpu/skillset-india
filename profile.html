
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | SkillSet India</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172033;
    }

    header {
      background: #123c69;
      color: white;
      padding: 16px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h2 { margin: 0; }

    nav {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    #languageSelect {
      padding: 8px;
      border-radius: 7px;
      border: 0;
    }

    .container {
      width: min(760px, 92%);
      margin: 32px auto;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 5px 24px #17203312;
    }

    .heading {
      text-align: center;
      margin-bottom: 25px;
    }

    .avatar {
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: #dceafe;
      color: #123c69;
      font-size: 32px;
      font-weight: bold;
    }

    .heading h1 { margin: 8px 0; }

    .muted { color: #667085; }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .detail {
      background: #f7f9fc;
      padding: 14px;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    .detail span {
      display: block;
      color: #667085;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .detail strong { font-size: 15px; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    button, .button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    .primary {
      background: #1769d2;
      color: white;
    }

    .secondary {
      background: #e8edf5;
      color: #172033;
    }

    form {
      margin-top: 20px;
      border-top: 1px solid #e4e9f1;
      padding-top: 20px;
    }

    [hidden] { display: none !important; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .field { min-width: 0; }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd5e2;
      border-radius: 8px;
      font: inherit;
      background: white;
    }

    .full { grid-column: 1 / -1; }

    #status {
      margin-top: 16px;
      font-weight: bold;
    }

    .empty { text-align: center; padding: 25px 5px; }

    @media (max-width: 540px) {
      header { padding: 16px 5%; }
      .details, .form-grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .card { padding: 20px; }
    }
  </style>
</head>

<body>
<header>
  <h2>SkillSet India</h2>

  <nav>
    <a href="index.html" data-i18n="home">Home</a>
    <a href="register.html" data-i18n="register">Register</a>
    <a href="profile.html" data-i18n="myProfile">My Profile</a>

    <select id="languageSelect" aria-label="Choose language">
      <option value="en">English</option>
      <option value="hi">हिन्दी</option>
    </select>
  </nav>
</header>

<main class="container">
  <div class="card">

    <section id="profileSection" hidden>
      <div class="heading">
        <div class="avatar" id="avatar">U</div>
        <h1 data-i18n="myProfile">My Profile</h1>
        <p id="displayName"></p>
        <p class="muted" id="displayRole"></p>
      </div>

      <div class="details">
        <div class="detail">
          <span data-i18n="name">Full Name</span>
          <strong id="valueName"></strong>
        </div>
        <div class="detail">
          <span data-i18n="role">Role</span>
          <strong id="valueRole"></strong>
        </div>
        <div class="detail">
          <span data-i18n="email">Email</span>
          <strong id="valueEmail"></strong>
        </div>
        <div class="detail">
          <span data-i18n="mobile">Mobile Number</span>
          <strong id="valueMobile"></strong>
        </div>
        <div class="detail">
          <span data-i18n="city">City</span>
          <strong id="valueCity"></strong>
        </div>
        <div class="detail">
          <span data-i18n="skill">Skill / Profession</span>
          <strong id="valueSkill"></strong>
        </div>
        <div class="detail">
          <span data-i18n="experience">Experience</span>
          <strong id="valueExperience"></strong>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="editButton" type="button"
          data-i18n="edit">Edit Profile</button>
        <a class="button secondary" href="index.html"
          data-i18n="home">Home</a>
      </div>
    </section>

    <section id="emptySection" class="empty" hidden>
      <h1 data-i18n="notFound">Profile Not Found</h1>
      <p data-i18n="registerFirst">
        Please register first to create your profile.
      </p>
      <a class="button primary" href="register.html"
        data-i18n="registerNow">Register Now</a>
    </section>

    <section id="editSection" hidden>
      <h1 data-i18n="edit">Edit Profile</h1>
      <p class="muted" data-i18n="editHelp">
        Update your information below.
      </p>

      <form id="profileForm">
        <div class="form-grid">
          <div class="field">
            <label for="fullName" data-i18n="name">Full Name</label>
            <input id="fullName" name="fullName" required maxlength="100">
          </div>

          <div class="field">
            <label for="role" data-i18n="role">Role</label>
            <select id="role" name="role" required>
              <option value="Worker" data-i18n="worker">Worker</option>
              <option value="Employer" data-i18n="employer">Employer</option>
              <option value="Freelancer" data-i18n="freelancer">Freelancer</option>
              <option value="Learner" data-i18n="learner">Learner</option>
              <option value="Teacher" data-i18n="teacher">Teacher</option>
            </select>
          </div>

          <div class="field">
            <label for="email" data-i18n="email">Email</label>
            <input id="email" name="email" type="email" maxlength="150">
          </div>

          <div class="field">
            <label for="mobile" data-i18n="mobile">Mobile Number</label>
            <input id="mobile" name="mobile" type="tel"
              inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required>
          </div>

          <div class="field">
            <label for="city" data-i18n="city">City</label>
            <input id="city" name="city" required maxlength="100">
          </div>

          <div class="field">
            <label for="skill" data-i18n="skill">Skill / Profession</label>
            <select id="skill" name="skill" required>
              <option value="" data-i18n="selectSkill">Select Skill</option>
              <option value="Electrician" data-i18n="electrician">Electrician</option>
              <option value="Plumber" data-i18n="plumber">Plumber</option>
              <option value="Carpenter" data-i18n="carpenter">Carpenter</option>
              <option value="Mistri / Raj Mistri" data-i18n="mistri">Mistri / Raj Mistri</option>
              <option value="Labourer" data-i18n="labourer">Labourer</option>
              <option value="Cook" data-i18n="cook">Cook</option>
              <option value="Driver" data-i18n="driver">Driver</option>
              <option value="Tailor" data-i18n="tailor">Tailor</option>
              <option value="Graphic Designer" data-i18n="designer">Graphic Designer</option>
              <option value="Web Developer" data-i18n="developer">Web Developer</option>
              <option value="Teacher/Tutor" data-i18n="tutor">Teacher/Tutor</option>
              <option value="Beauty Professional" data-i18n="beauty">Beauty Professional</option>
              <option value="Entrepreneur/Business Owner" data-i18n="business">Entrepreneur/Business Owner</option>
              <option value="Other" data-i18n="other">Other</option>
            </select>
          </div>

          <div class="field full">
            <label for="experience" data-i18n="experience">Experience</label>
            <select id="experience" name="experience" required>
              <option value="" data-i18n="selectExperience">Select Experience</option>
              <option value="Fresher" data-i18n="fresher">Fresher</option>
              <option value="Less than 1 year" data-i18n="less1">Less than 1 year</option>
              <option value="1-3 years" data-i18n="years13">1-3 years</option>
              <option value="3-5 years" data-i18n="years35">3-5 years</option>
              <option value="5+ years" data-i18n="years5">5+ years</option>
              <option value="10+ years" data-i18n="years10">10+ years</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button class="primary" type="submit"
            data-i18n="save">Save Changes</button>
          <button class="secondary" id="cancelButton" type="button"
            data-i18n="cancel">Cancel</button>
        </div>
      </form>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
  </div>
</main>

<script>
const STORAGE_KEY = "skillset_demo_profile";
const LANGUAGE_KEY = "skillset_language";

const translations = {
  en: {
    home:"Home", register:"Register", myProfile:"My Profile",
    registerNow:"Register Now", notFound:"Profile Not Found",
    registerFirst:"Please register first to create your profile.",
    edit:"Edit Profile", editHelp:"Update your information below.",
    save:"Save Changes", cancel:"Cancel", name:"Full Name",
    role:"Role", email:"Email", mobile:"Mobile Number", city:"City",
    skill:"Skill / Profession", experience:"Experience",
    worker:"Worker", employer:"Employer", freelancer:"Freelancer",
    learner:"Learner", teacher:"Teacher", selectSkill:"Select Skill",
    electrician:"Electrician", plumber:"Plumber", carpenter:"Carpenter",
    mistri:"Mistri / Raj Mistri", labourer:"Labourer", cook:"Cook",
    driver:"Driver", tailor:"Tailor", designer:"Graphic Designer",
    developer:"Web Developer", tutor:"Teacher/Tutor", beauty:"Beauty Professional",
    business:"Entrepreneur/Business Owner", other:"Other",
    selectExperience:"Select Experience", fresher:"Fresher",
    less1:"Less than 1 year", years13:"1-3 years", years35:"3-5 years",
    years5:"5+ years", years10:"10+ years",
    notProvided:"Not provided", updated:"Profile updated successfully!",
    saveError:"Could not save profile in this browser.",
    invalidMobile:"Please enter a valid 10-digit mobile number."
  },
  hi: {
    home:"होम", register:"रजिस्ट्रेशन", myProfile:"मेरी प्रोफ़ाइल",
    registerNow:"अभी रजिस्टर करें", notFound:"प्रोफ़ाइल नहीं मिली",
    registerFirst:"प्रोफ़ाइल बनाने के लिए पहले रजिस्ट्रेशन करें।",
    edit:"प्रोफ़ाइल बदलें", editHelp:"नीचे अपनी जानकारी अपडेट करें।",
    save:"बदलाव सेव करें", cancel:"रद्द करें", name:"पूरा नाम",
    role:"आपकी भूमिका", email:"ईमेल", mobile:"मोबाइल नंबर", city:"शहर",
    skill:"कौशल / काम", experience:"अनुभव",
    worker:"कामगार", employer:"काम देने वाला", freelancer:"फ्रीलांसर",
    learner:"सीखने वाला", teacher:"शिक्षक", selectSkill:"कौशल चुनें",
    electrician:"इलेक्ट्रीशियन", plumber:"प्लंबर", carpenter:"बढ़ई",
    mistri:"मिस्त्री / राज मिस्त्री", labourer:"मजदूर", cook:"रसोइया",
    driver:"ड्राइवर", tailor:"दर्जी", designer:"ग्राफिक डिज़ाइनर",
    developer:"वेब डेवलपर", tutor:"शिक्षक / ट्यूटर",
    beauty:"ब्यूटी प्रोफेशनल", business:"व्यवसायी / बिज़नेस मालिक",
    other:"अन्य", selectExperience:"अनुभव चुनें", fresher:"नया कामगार",
    less1:"1 साल से कम", years13:"1-3 साल", years35:"3-5 साल",
    years5:"5+ साल", years10:"10+ साल", notProvided:"जानकारी नहीं दी गई",
    updated:"प्रोफ़ाइल सफलतापूर्वक अपडेट हो गई!",
    saveError:"इस ब्राउज़र में प्रोफ़ाइल सेव नहीं हो सकी।",
    invalidMobile:"कृपया 10 अंकों का सही मोबाइल नंबर डालें।"
  }
};

const $ = id => document.getElementById(id);
let profile = null;
let language = localStorage.getItem(LANGUAGE_KEY) || "en";

function t(key) {
  return (translations[language] || translations.en)[key] ||
         translations.en[key] || key;
}

function applyLanguage() {
  document.documentElement.lang = language;
  $("languageSelect").value = language;

  document.querySelectorAll("[data-i18n]").forEach(element => {
    const key = element.dataset.i18n;
    const translation = t(key);

    if (element.tagName === "OPTION") {
      element.textContent = translation;
    } else {
      element.textContent = translation;
    }
  });

  document.title = language === "hi"
    ? "मेरी प्रोफ़ाइल | SkillSet India"
    : "My Profile | SkillSet India";

  if (profile) renderProfile();
}

function loadProfile() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    profile = saved ? JSON.parse(saved) : null;

    if (!profile || typeof profile !== "object" ||
        Array.isArray(profile)) {
      profile = null;
    }
  } catch {
    profile = null;
  }

  renderProfile();
}

function showValue(id, value) {
  $(id).textContent =
    value == null || String(value).trim() === ""
      ? t("notProvided")
      : String(value);
}

function renderProfile() {
  $("status").textContent = "";

  if (!profile) {
    $("profileSection").hidden = true;
    $("editSection").hidden = true;
    $("emptySection").hidden = false;
    return;
  }

  $("emptySection").hidden = true;
  $("editSection").hidden = true;
  $("profileSection").hidden = false;

  showValue("displayName", profile.fullName);
  showValue("displayRole", profile.role);
  showValue("valueName", profile.fullName);
  showValue("valueRole", profile.role);
  showValue("valueEmail", profile.email);
  showValue("valueMobile", profile.mobile);
  showValue("valueCity", profile.city);
  showValue("valueSkill", profile.skill);
  showValue("valueExperience", profile.experience);

  const name = String(profile.fullName || "U").trim();
  $("avatar").textContent = name.charAt(0).toUpperCase();
}

function startEditing() {
  if (!profile) return;

  const form = $("profileForm");
  ["fullName","role","email","mobile","city","skill","experience"]
    .forEach(key => {
      form.elements[key].value = profile[key] || "";
    });

  $("profileSection").hidden = true;
  $("emptySection").hidden = true;
  $("editSection").hidden = false;
  $("status").textContent = "";
}

$("languageSelect").addEventListener("change", event => {
  language = event.target.value;
  localStorage.setItem(LANGUAGE_KEY, language);
  applyLanguage();
});

$("editButton").addEventListener("click", startEditing);
$("cancelButton").addEventListener("click", renderProfile);

$("profileForm").addEventListener("submit", event => {
  event.preventDefault();

  const form = event.currentTarget;
  const mobile = form.elements.mobile.value.trim();

  if (!/^[0-9]{10}$/.test(mobile)) {
    $("status").textContent = t("invalidMobile");
    return;
  }

  const updatedProfile = {
    ...profile,
    fullName: form.elements.fullName.value.trim(),
    role: form.elements.role.value,
    email: form.elements.email.value.trim(),
    mobile,
    city: form.elements.city.value.trim(),
    skill: form.elements.skill.value,
    experience: form.elements.experience.value
  };

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedProfile));
    profile = updatedProfile;
    renderProfile();
    $("status").textContent = t("updated");
  } catch {
    $("status").textContent = t("saveError");
  }
});

applyLanguage();
loadProfile();
</script>
</body>
</html>
